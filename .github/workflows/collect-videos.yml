name: Collect public YouTube catalogue

on:
  workflow_dispatch:
    inputs:
      publish_api_output:
        description: Also expose public metadata in check-run output for API inspection
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out the metadata helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect the complete public uploads tab
        id: catalogue
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from urllib.parse import urlsplit

          result = subprocess.run(
              [sys.executable, "scripts/sync-youtube-videos.py", "--output",
               str(Path(os.environ["RUNNER_TEMP"]) / "public-videos/videos.json")],
              capture_output=True, text=True,
          )
          if result.returncode:
              diagnostic = next(
                  (line for line in result.stderr.splitlines()
                   if line.startswith("Could not refresh public channel metadata:")),
                  f"The public metadata helper failed with exit code {result.returncode}; no catalogue was produced.",
              )
              # Emit only the helper's concise error, never raw responses,
              # traceback/configuration dumps, or API/client query values.
              if re.search(r"(?i)(?:[?&](?:key|token|access_token)=|authorization\s*[:=]|INNERTUBE_|visitorData\s*[:=])", diagnostic):
                  diagnostic = "The helper rejected an API/client configuration response; detailed values were omitted."
              diagnostic = diagnostic[:2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Public YouTube catalogue collection failed::{diagnostic}")
              if diagnostic == "Could not refresh public channel metadata: Unsupported uploads renderer lockupViewModel; no partial catalogue was saved.":
                  try:
                      sys.dont_write_bytecode = True
                      spec = importlib.util.spec_from_file_location("youtube_metadata", "scripts/sync-youtube-videos.py")
                      helper = importlib.util.module_from_spec(spec)
                      spec.loader.exec_module(helper)
                      html = helper.fetch(helper.CHANNEL_URL + "?hl=en&gl=US")
                      initial = helper.assigned_json_maps(html, r"(?:var\s+ytInitialData\s*=|window\[['\"]ytInitialData['\"]\]\s*=)\s*")[0]
                      tabs = initial["contents"]["twoColumnBrowseResultsRenderer"]["tabs"]
                      tab = next(item["tabRenderer"] for item in tabs if item.get("tabRenderer", {}).get("selected"))
                      tab_url = tab["endpoint"]["commandMetadata"]["webCommandMetadata"]["url"]
                      if not urlsplit(tab_url).path.rstrip("/").endswith("/videos"):
                          raise ValueError("Selected tab is not public uploads")
                      items = tab["content"]["richGridRenderer"]["contents"]
                      node = next(item["richItemRenderer"]["content"]["lockupViewModel"] for item in items
                                  if isinstance(item.get("richItemRenderer", {}).get("content", {}).get("lockupViewModel"), dict))
                      metadata = node.get("metadata", {})
                      lockup_metadata = metadata.get("lockupMetadataViewModel", {})
                      title = lockup_metadata.get("title", {})
                      # Only public schema keys and canonical video/title fields;
                      # never serialize tracking, endpoints, or client context.
                      evidence = {
                          "nodeKeys": sorted(node),
                          "contentId": node.get("contentId") if isinstance(node.get("contentId"), str) else None,
                          "contentType": node.get("contentType") if isinstance(node.get("contentType"), str) else None,
                          "metadataKeys": sorted(metadata),
                          "lockupMetadataViewModelKeys": sorted(lockup_metadata),
                          "titleKeys": sorted(title) if isinstance(title, dict) else [],
                          "titleType": type(title).__name__,
                          "titleValues": {key: title[key] for key in ("content", "simpleText", "text")
                                          if isinstance(title, dict) and isinstance(title.get(key), str)},
                          "runsText": [run["text"] for run in title.get("runs", [])
                                       if isinstance(run, dict) and isinstance(run.get("text"), str)] if isinstance(title, dict) else [],
                      }
                      message = json.dumps(evidence, ensure_ascii=False).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::notice title=Public YouTube renderer specimen::{message}")
                  except Exception as error:
                      print(f"::notice title=Public YouTube renderer specimen::Public schema capture unavailable ({type(error).__name__}); raw response details omitted.")
              raise SystemExit(result.returncode)
          print(result.stdout, end="")
          PY
      - name: Verify public video thumbnails
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          catalogue = json.loads((Path(os.environ["RUNNER_TEMP"]) / "public-videos/videos.json").read_text(encoding="utf-8"))
          for video in catalogue["videos"]:
              request = Request(f"https://img.youtube.com/vi/{video['id']}/hqdefault.jpg", headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urlopen(request, timeout=30) as response:
                      assert response.status == 200
                      assert response.headers.get_content_type() == "image/jpeg"
                      assert response.read(16).startswith(b"\xff\xd8")
              except Exception as error:
                  print(f"::error title=Public video thumbnail verification failed::{video['id']}: {type(error).__name__}")
                  raise SystemExit(1)
          print(f"::notice title=Public video thumbnails verified::{len(catalogue['videos'])} thumbnails returned HTTPS 200 and valid JPEG content.")
          PY
      - name: Upload metadata for review
        uses: actions/upload-artifact@v4
        with:
          name: public-youtube-catalogue
          path: ${{ runner.temp }}/public-videos/videos.json
          if-no-files-found: error
          retention-days: 7
      - name: Expose public metadata through the Checks API when requested
        if: ${{ inputs.publish_api_output }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_HEAD_SHA: ${{ github.sha }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          payload = (Path(os.environ["RUNNER_TEMP"]) / "public-videos/videos.json").read_text(encoding="utf-8")
          catalogue = json.loads(payload)
          assert catalogue["complete"] is True
          assert catalogue["source"] == "https://www.youtube.com/@SopranoRena/videos"
          digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          # Bound each UTF-8 part below the Checks API's output text limit.
          parts = [payload[offset:offset + 12000] for offset in range(0, len(payload), 12000)]
          for index, part in enumerate(parts, 1):
              body = {
                  "name": f"Public YouTube catalogue {index:04d}/{len(parts):04d}",
                  "head_sha": os.environ["GH_HEAD_SHA"],
                  "details_url": os.environ["GH_RUN_URL"],
                  "status": "completed",
                  "conclusion": "success",
                  "output": {
                      "title": "Public uploads metadata for review",
                      "summary": f"{len(catalogue['videos'])} public uploads; part {index}/{len(parts)}. Join output.text parts in numeric order. UTF-8 SHA-256: {digest}",
                      "text": part,
                  },
              }
              request = Request(
                  f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/check-runs",
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  json.load(response)
          print(f"Published {len(parts)} check-run output part(s) containing public metadata only.")
          PY
