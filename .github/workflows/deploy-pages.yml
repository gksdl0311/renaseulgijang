name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Read the GitHub Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the website
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          ASTRO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ASTRO_SITE_URL: ${{ steps.pages.outputs.origin }}
      - name: Verify multilingual pages and assets
        run: npm run check:site
        env:
          ASTRO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ASTRO_SITE_URL: ${{ steps.pages.outputs.origin }}
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
